name: features
description: >-
  Fan-facing feature modules for Assen Platform (consumed by fan_app, and any
  shared surface). P0 ships a placeholder screen; real features (home, schedule,
  cheki, ...) arrive from P3 onward, one narrow module each.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  api_client:
    path: ../api_client
  core_tokens:
    path: ../core_tokens
  flutter:
    sdk: flutter
  # Riverpod 3.x ONLY — 2.x syntax is forbidden in this repo (CONSTRAINTS #40).
  flutter_riverpod: ^3.0.0
  ui_kit:
    path: ../ui_kit
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test_fixtures:
    path: ../test_fixtures

# Resolve against the workspace lockfile (CONSTRAINTS #17).
resolution: workspace

flutter:
  uses-material-design: true
