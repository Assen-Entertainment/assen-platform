name: ui_kit
description: >-
  Assen Platform design system in Flutter: ThemeData and the shared widget
  catalogue. This is the same artefact the Technical Architecture calls
  "design_system". P0 ships a placeholder theme builder; ASS-88 fills in the
  full ThemeData and core widgets from docs/design.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  # Token primitives (placeholder in P0, code-generated in P1).
  core_tokens:
    path: ../core_tokens
  flutter:
    sdk: flutter

dev_dependencies:
  # Golden testing for the widget catalogue. `--update-goldens` is human-gated
  # (CONSTRAINTS #31); agents never regenerate goldens autonomously.
  alchemist: ^0.12.0
  flutter_test:
    sdk: flutter

# Resolve against the workspace lockfile (CONSTRAINTS #17).
resolution: workspace

flutter:
  uses-material-design: true
  # Pretendard (SIL OFL 1.1) — the design SSOT face (docs/design/tokens.v2.json
  # typography.fontFamily). Bundled here so the shared design system, and every
  # app that depends on ui_kit, ships the real font. Weights map to the type
  # scale: Regular=400, Medium=500, SemiBold=600, Bold=700. Staged by
  # tools/fonts/setup_pretendard.sh; LICENSE ships alongside (fonts/LICENSE).
  fonts:
    - family: Pretendard
      fonts:
        - asset: fonts/Pretendard-Regular.otf
          weight: 400
        - asset: fonts/Pretendard-Medium.otf
          weight: 500
        - asset: fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: fonts/Pretendard-Bold.otf
          weight: 700
