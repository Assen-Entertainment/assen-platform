name: web-ci
on:
  push:
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  # 컨테이너 패키징(ECS 경로) 상시 검증 — 빌드만, 푸시 없음(SDLC 11 §3).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web standalone image
        run: docker build -f web/Dockerfile web
