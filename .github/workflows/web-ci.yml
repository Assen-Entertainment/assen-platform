name: web-ci
on:
  push:
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  # 컨테이너 패키징(ECS 경로) 상시 검증 — 빌드만, 푸시 없음(SDLC 11 §3).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NEXT_PUBLIC_API_URL placeholder — Dockerfile 프로드 가드가 빈 값을 거부한다(인증 미들웨어 풋건 방지).
      # 이 이미지는 푸시하지 않는 패키징 스모크이므로 실 API 대신 비배포 placeholder를 주입한다.
      - name: Build web standalone image
        run: docker build -f web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://ci-smoke.invalid/api web
