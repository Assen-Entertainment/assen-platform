name: web-ci
on:
  push:
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build
