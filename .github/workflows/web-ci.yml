name: web-ci
on:
  # push는 통합 브랜치(dev/main)로 좁혀 PR 브랜치 push+pull_request 이중 실행을 막는다(W4, e2e.yml과 동일 패턴).
  push:
    branches: [dev, main]
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]

# 최소 권한(W4) — 빌드/테스트/도커 패키징만 하며 쓰기 권한 불요.
permissions:
  contents: read

# 같은 ref의 이전 실행은 취소해 러너 분을 아낀다(ci.yml/e2e.yml/codeql.yml 패턴 미러 — 이
# 워크플로만 빠져 있었다).
concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      # Generated client types must match the committed OpenAPI snapshot (ASS-290):
      # regenerate from openapi.json and fail on any drift so schema.d.ts can never
      # go stale relative to the contract. (The server job gates openapi.json itself
      # against the live Django schema.)
      - name: Generated types match the OpenAPI snapshot (no drift)
        run: |
          npm run gen:types
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- web/src/lib/api/schema.d.ts; then
            echo "::error::web/src/lib/api/schema.d.ts is stale — run 'npm run gen:types' and commit."
            exit 1
          fi
      # ESLint 게이트(R6-W3) — 지금까지 CI에서 lint가 아예 안 돌던 SDLC 갭을 메운다.
      # next.config는 빌드 시 lint를 켜두나, 명시 스텝으로 실패를 조기·독립적으로 드러낸다.
      - run: npm run lint
      - run: npm run build
      # 번들 회귀 게이트(R6-W3) — build 산출(.next/static/chunks)의 클라이언트 JS 총량/최대
      # 청크를 상한 검사한다. 상한·근거는 scripts/check-bundle-budget.mjs 상단 주석.
      - run: npm run check:budget
      # 커버리지 게이트(ASS-279) — test:coverage는 test와 동일한 스위트를 v8 프로바이더로
      # 계측 실행하므로 npm test를 별도로 다시 돌리지 않는다(중복 실행 방지). 임계치는
      # 아직 미설정(fail 조건 없음) — 리포트를 아티팩트로 남겨 추세만 관찰한다.
      # 회귀방지 최소 플로어 참고값(DevOps 위생, 미시행) — 2026-07-10 `npm run test:coverage`
      # 로컬 실측 Statements 61.11% 기준 −2%p = 59%. vitest.config.ts에 thresholds로 실제
      # 시행하려면 이 값을 기준점으로 삼되, 그 결정과 트렌드 확인은 별도.
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage-report
          path: web/coverage/
          retention-days: 14
      # Storybook 빌드 스모크(ASS-279) — 스토리 컴파일 회귀를 조기에 드러낸다. a11y CLI
      # 게이트(@storybook/test-runner 등)는 미설치라 addon-a11y(에디터 패널)만으로는
      # 자동화할 수 없어 보류(ASS-279 반환 참조).
      - run: npm run build-storybook

  # 컨테이너 패키징(ECS 경로) 상시 검증 — 빌드만, 푸시 없음(SDLC 11 §3).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NEXT_PUBLIC_API_URL placeholder — Dockerfile 프로드 가드가 빈 값을 거부한다(인증 미들웨어 풋건 방지).
      # 이 이미지는 푸시하지 않는 패키징 스모크이므로 실 API 대신 비배포 placeholder를 주입한다.
      - name: Build web standalone image
        run: docker build -f web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://ci-smoke.invalid/api web
