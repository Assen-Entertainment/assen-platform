name: Golden baselines

# ui_kit 픽셀 골든 게이트를 #31(인간 승인) 규칙에 맞춰 CI에서 운영한다.
#
# 대표 결정: 골든 베이스라인은 CI(Linux) 기준이다. 로컬(Windows)에서
# `--update-goldens`/`goldens/` 쓰기는 scripts/hooks/guard.py(#31)가 하드 차단하고,
# 렌더 결과가 CI Linux와 달라 베이스라인으로 부적합하다. 따라서:
#
#   verify  잡(모든 PR): ui_kit 골든 테스트를 CI에서 실행해 승인된 베이스라인과의
#     회귀를 막는다. 베이스라인 PNG가 아직 없고 goldenTest(...)가 skip: true 인
#     동안에는 골든 시나리오가 스킵되어 사실상 no-op 이다(다른 testWidgets 는 계속
#     게이트). generate 잡이 베이스라인을 만들고 언스킵하면 그때부터 실질 게이트가 된다.
#
#   generate 잡(수동 dispatch): 대표가 "Run workflow"를 1회 클릭 = #31 인간 승인.
#     Linux 기준으로 #31 마커가 붙은 goldenTest 를 언스킵한 뒤 `--update-goldens`로
#     베이스라인을 생성하고, 생성물(언스킵된 테스트 + goldens PNG)을 자동 커밋한다.
#     즉 1클릭으로 Linux 베이스라인 + 언스킵이 원자적으로 반영된다.
#
# 자세한 절차는 docs/ops/golden-baselines.md 런북 참고.

on:
  pull_request:
    paths:
      - "packages/ui_kit/**"
      - ".github/workflows/golden.yml"
  workflow_dispatch:

# 같은 ref 의 이전 실행은 취소해 러너 시간을 아낀다.
concurrency:
  group: golden-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ui_kit goldens (compare to baseline)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-cache-${{ runner.os }}-
      - name: Bootstrap workspace
        run: dart pub get
      # 골든 비교를 CI(Linux) 기준으로 수행한다. 베이스라인 PNG가 아직 없고
      # goldenTest(...) 가 skip: true 인 동안에는 픽셀 시나리오가 스킵되어 no-op 이다.
      # generate 잡이 베이스라인을 만들고 언스킵하면 이 잡이 실질 골든 회귀 게이트가 된다.
      - name: Run ui_kit tests (golden compare)
        working-directory: packages/ui_kit
        run: flutter test

  generate:
    name: Generate + unskip goldens (human approval, #31)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      # 생성된 베이스라인 + 언스킵을 dispatch 한 ref 로 되커밋하기 위해 필요.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-cache-${{ runner.os }}-
      - name: Bootstrap workspace
        run: dart pub get
      # 언스킵을 --update-goldens 보다 먼저 한다: skip: true 인 goldenTest 는 실행 자체가
      # 스킵되어 베이스라인이 생성되지 않기 때문이다. #31 마커("(#31)")가 붙은 skip: true
      # 줄만 정밀 제거하고, 마커 없는 다른 skip 은 절대 건드리지 않는다.
      - name: Unskip #31 golden tests
        run: |
          mapfile -t files < <(grep -rlE 'skip:[[:space:]]*true,[[:space:]]*//.*#31' packages/ui_kit/test)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no #31-marked golden skips found — nothing to unskip"
          fi
          for f in "${files[@]}"; do
            sed -i -E '/skip:[[:space:]]*true,[[:space:]]*\/\/.*#31/d' "$f"
            echo "unskipped: $f"
          done
      # Linux(CI) 기준 베이스라인 생성. #31 가드는 로컬(비-CI)에서만 --update-goldens 를
      # 차단하며, 이 스텝은 대표가 명시적으로 트리거한 CI 실행(= 인간 승인)이다.
      - name: Generate goldens (--update-goldens)
        working-directory: packages/ui_kit
        run: flutter test --update-goldens
      # 언스킵된 테스트 + 생성된 goldens PNG(둘 다 test/** 하위)를 dispatch 한 ref 로 커밋.
      - name: Commit baselines + unskips
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            test(ui_kit): generate golden baselines + unskip (#31, CI Linux)

            대표 1클릭 승인(workflow_dispatch)으로 생성된 Linux 베이스라인.
          file_pattern: "packages/ui_kit/test/**"
