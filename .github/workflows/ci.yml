name: CI

# CONSTRAINTS #24: lint + typecheck + test + 3-target build smoke gate every PR.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  # The assen_mobile web build-smoke runs on every PR/push (catches packaging
  # breaks that analyze/test miss); the heavier android apk build-smoke (debug)
  # runs on every PR too (ASS-279), plus on demand or on the weekly schedule below.
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 03:00 UTC — drives the on-demand app build-smoke steps.
    - cron: "0 3 * * 1"

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (ruff + mypy + pytest + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy .
      - name: Pytest
        run: uv run pytest
      - name: Migrations are committed (sqlite test settings, no DB server)
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test

  flutter:
    name: Flutter (format + analyze + test + web/android build smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pub-cache-${{ runner.os }}-
      - name: Bootstrap workspace
        run: dart pub get
      - name: Format check
        run: dart run melos run format --no-select
      - name: Analyze
        run: dart run melos run analyze --no-select
      - name: Test
        run: dart run melos run test --no-select
      # 메이드 앱(fan_app/operator_app)은 플랫폼 피벗에서 제거됨(B9/M10). 신방향 앱
      # apps/assen_mobile의 웹 빌드 스모크는 매 PR/push에서 실행해 analyze/test는
      # green인데 패키징(웹 번들)이 깨지는 갭을 차단한다. android apk 빌드(debug)는
      # PR·수동 dispatch·주간 schedule에서 실행한다(ASS-279: 이전엔 dispatch/schedule
      # 전용이라 PR에서 패키징 회귀가 새지 않는지 확인이 안 됐다). 매 push(dev/main)까지는
      # 비용상 미포함. 재사용 패키지(core_tokens·ui_kit·api_client)는 위 analyze/test가
      # 계속 게이트한다.
      - name: Web build smoke (assen_mobile)
        if: ${{ hashFiles('apps/assen_mobile/pubspec.yaml') != '' }}
        working-directory: apps/assen_mobile
        run: flutter build web --no-pub
      - name: Android build smoke (assen_mobile, debug)
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && hashFiles('apps/assen_mobile/pubspec.yaml') != '' }}
        working-directory: apps/assen_mobile
        run: flutter build apk --debug --no-pub

  compose:
    name: docker compose validate + boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Boot and smoke local backend stack
        run: scripts/up-local.sh
      - name: Tear down
        if: always()
        run: docker compose down -v

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action@v2는 org 저장소에 GITLEAKS_LICENSE를 요구한다.
      # CLI 자체는 MIT라 바이너리 직접 실행으로 동일 검사를 수행한다.
      - name: Run gitleaks CLI
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

  hooks:
    name: Harness hooks (guard.py + pre-commit behavioral tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 순수 stdlib — 의존성 설치 불요. guard.py 회귀를 CI에서 게이트한다 (ASS-132).
      - name: Run hook guard tests (guard.py)
        run: python3 scripts/hooks/test_hooks.py
      # install-hooks.sh 가 core.hooksPath 를 올바르게 설정하는지 검증 (ASS-133).
      - name: Install hooks and verify core.hooksPath
        run: |
          bash scripts/install-hooks.sh
          HOOKS_PATH="$(git config core.hooksPath)"
          echo "core.hooksPath = ${HOOKS_PATH}"
          test "${HOOKS_PATH}" = "scripts/hooks"
      # pre-commit 행위 테스트: 차단·허용 시나리오를 샌드박스 repo에서 실증 (ASS-133).
      - name: Run pre-commit behavioral tests
        run: bash scripts/hooks/test_pre_commit.sh
