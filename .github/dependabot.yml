version: 2

# 의존성 최신화 게이트(ASS-279) — 실제 존재하는 매니페스트 디렉토리별로 주간 업데이트 PR을 연다.
# 각 워크플로(ci.yml/web-ci.yml/e2e.yml)가 이미 lint/typecheck/test로 게이트하므로
# 여기서는 PR 생성만 담당한다(자동 머지 없음 — CODEOWNERS의 인간 게이트 원칙과 동일선상).
#
# grouping(2026-07-11): 각 생태계의 minor/patch 범프를 **하나의 PR로 묶는다**. 개별 PR이
# 같은 lockfile(package-lock.json/uv.lock/pubspec.lock)을 건드려 서로 conflict하는
# cascade를 없애고 리뷰 노이즈를 줄인다. **major 범프는 그룹에서 제외**되어 개별 PR로
# 남는다 — 파괴적 변경이 잦아 하나씩 검증·채택해야 하기 때문(Django 6·vite 8·pytest 9 등).
updates:
  # web/ — package-lock.json (npm)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # landing/ — 별도 정적 사이트, 독립 package-lock.json (npm)
  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"
    groups:
      landing-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # server/ — pyproject.toml + uv.lock (uv)
  - package-ecosystem: "uv"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      server-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # .github/workflows/*.yml 의 액션 버전 (github-actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 루트 pub workspace(melos) — pubspec.yaml/pubspec.lock, apps/assen_mobile·packages/*
  # 멤버는 resolution: workspace로 이 단일 락파일을 공유한다(개별 pubspec.lock 없음).
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
