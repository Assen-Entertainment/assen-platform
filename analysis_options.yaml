# Shared analysis ruleset for the whole workspace (CONSTRAINTS #39).
# Every member package includes this file relatively, so strict typing is
# enforced uniformly. very_good_analysis supplies the lint set; the language
# block turns the type-system sensors up to maximum (no implicit casts, no
# inference holes, no raw generics).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated artefacts are owned by build_runner / swagger_parser, never edited
    # by hand (CONSTRAINTS #32), so they are out of scope for analysis here.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    # Style Dictionary token output (ASS-128) is generated from tokens.json and
    # carries a DO-NOT-EDIT header; lint it at the source, not here (same policy
    # as build_runner output above).
    - "**/*.gen.dart"
    # The token codegen tool is an npm project (Node), not Dart workspace code;
    # its node_modules can contain third-party Dart examples. Out of scope here.
    - "tools/**"
