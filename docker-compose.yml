# Local/dev orchestration for the Assen Platform backend. The dev host has no
# Docker, so this file is authored but validated in CI (`docker compose config`
# plus a postgres/redis/worker boot smoke). See .github/workflows/ci.yml.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assen}
      POSTGRES_USER: ${POSTGRES_USER:-assen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assen}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assen}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    # daphne (ASGI) — mirror the prod Dockerfile CMD so the Channels WebSocket
    # stack is exercised locally; gunicorn (WSGI) would silently drop websockets
    # (dev/prod parity — ASS-268).
    command: uv run --no-sync daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-assen}:${POSTGRES_PASSWORD:-assen}@postgres:5432/${POSTGRES_DB:-assen}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Shared cross-worker Channels layer (ASS-268 follow-up): DB …/3, distinct from
      # Celery's broker/result backend (…/0, …/1) and the rate limiter (…/2) on the
      # same redis service. daphne (ASGI) is the process that actually serves the
      # WebSocket stack, so it needs the real layer for socket groups to span workers.
      CHANNEL_LAYERS_BACKEND: redis
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/3
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').getcode()==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    command: uv run --no-sync celery -A config worker --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-assen}:${POSTGRES_PASSWORD:-assen}@postgres:5432/${POSTGRES_DB:-assen}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Shared cross-worker Channels layer (ASS-268 follow-up), same DB as the api
      # service so any group_send from a task lands in the same shared layer.
      CHANNEL_LAYERS_BACKEND: redis
      CHANNEL_LAYERS_REDIS_URL: redis://redis:6379/3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  celery-beat:
    build:
      context: ./server
      dockerfile: Dockerfile
      args:
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    command: uv run --no-sync celery -A config beat --loglevel=info
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-assen}:${POSTGRES_PASSWORD:-assen}@postgres:5432/${POSTGRES_DB:-assen}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
