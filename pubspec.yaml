# Assen Platform — Dart pub workspace root (CONSTRAINTS #17).
#
# This is NOT a publishable package; it only declares the workspace member list
# so a single `pub get` resolves every app and package against one lockfile.
# Per-member pubspecs opt in with `resolution: workspace`.
#
# Melos 7 is the task runner layered on top of pub workspaces. In Melos 7 the
# configuration (including scripts) lives here under the `melos:` key, not in a
# standalone melos.yaml. Run scripts with `dart run melos run <name>`.
name: assen_platform_workspace
publish_to: none

environment:
  sdk: ^3.12.1

# Workspace members. Order is irrelevant; pub builds the dependency graph.
#
# The 메이드-era apps (fan_app/operator_app) and their domain feature packages
# (features/operator_features) were removed in the platform pivot (Linear B9/M10,
# ASS-243/254) — git history is their archive. The reusable design-system and
# contract packages below survive and are the foundation the new-direction app
# (apps/assen_mobile) builds on.
workspace:
  # The new-direction app (M3, Linear ASS-244/E12) — scaffolded on top of the
  # reusable design-system and contract packages below.
  - apps/assen_mobile
  - packages/core_tokens
  - packages/ui_kit
  - packages/api_client
  - packages/test_fixtures

# Shared dev tooling resolved once for the whole workspace.
dev_dependencies:
  melos: ^8.2.2
  # Lint set + strict analysis, included relatively by every member package
  # (see ./analysis_options.yaml). Declared here so it resolves workspace-wide.
  very_good_analysis: ^10.0.0

# Melos 7 task runner. CI invokes these same scripts, so local and CI behaviour
# stay identical (see .github/workflows/ci.yml and AGENTS.md validation block).
melos:
  scripts:
    # Resolve the whole workspace against one lockfile.
    bootstrap:
      description: Resolve all workspace dependencies (pub get at the root).
      run: dart pub get

    analyze:
      description: Static analysis across every package with zero tolerance.
      run: dart analyze --fatal-infos --fatal-warnings .

    format:
      description: Verify formatting; fails (non-zero) if any file would change.
      run: dart format --set-exit-if-changed .

    test:
      description: Run the test suite in every package that defines tests.
      # `dart run melos` keeps the nested call working without a global install.
      run: dart run melos exec --dir-exists=test -- flutter test

    # --- Design token codegen (ASS-128, ADR-0004) -----------------------------
    # Single source: docs/design/tokens.json (DTCG). Style Dictionary writes the
    # Dart primitives (packages/core_tokens) and the Vite CSS (landing/src). The
    # tool lives in tools/tokens as an npm project (node is the SD runtime).
    codegen:
      description: Regenerate Dart + Vite CSS tokens from docs/design/tokens.json.
      run: npm --prefix tools/tokens run build

    # Proves the generated artefacts are hand-edit-free (#32) AND that the Vite
    # CSS still equals the landing :root with zero drift (ADR-0004 #2): it
    # regenerates, runs the CSS oracle, then fails if git sees ANY change to the
    # generated files (i.e. someone hand-edited a generated file).
    codegen:verify:
      description: Regenerate and assert zero diff (no hand-edits) + CSS diff-0.
      run: |
        npm --prefix tools/tokens run build
        node tools/tokens/verify-css.mjs
        git diff --exit-code -- 'packages/core_tokens/lib/src/*.gen.dart' landing/src/tokens.generated.css
