[project]
name = "assen-server"
version = "0.0.1"
description = "Assen Platform backend — Django 5.2 LTS + Django Ninja (ADR-0001)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==5.2.*",
    "django-ninja>=1.3,<2.0",
    "django-environ>=0.11,<1.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=23.0,<24.0",
    "django-linear-migrations>=2.3,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "django-stubs[compatible-mypy]>=5.1,<6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Settings modules use star-imports by design (base -> dev/test layering).
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
# Third-party Django ecosystem packages ship incomplete stubs; do not fail on
# their missing types, but keep strict checking on our own code.
ignore_missing_imports = true
# Migrations are generated; excluding them keeps strict mode focused on code we
# actually author (CONSTRAINTS #25 — migrations are human-gated, not edited).
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# Discover tests inside each domain app's tests/ package.
testpaths = ["apps", "config"]
