[project]
name = "assen-server"
version = "0.0.1"
description = "Assen Platform backend — Django 6.0 + Django Ninja (ADR-0001)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.0,<7.0",
    "django-ninja>=1.3,<2.0",
    "django-cors-headers>=4.4,<5.0",
    "django-environ>=0.14.0,<1.0",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
    # Image decode-verify for the upload boundary (ASS-271): PIL.Image.verify() +
    # a MAX_IMAGE_PIXELS decompression-bomb guard, beyond the 64-byte magic sniff.
    "Pillow>=10.0,<12.0",
    "psycopg[binary]>=3.2,<4.0",
    "gunicorn>=26.0,<27.0",
    "django-linear-migrations>=2.3,<3.0",
    # Realtime (ASS-240): Channels adds the ASGI WebSocket stack; daphne is the
    # ASGI server (must lead INSTALLED_APPS to override runserver). The shared
    # cross-worker layer (channels-redis) is an optional extra, see below.
    "channels>=4.0,<5.0",
    "daphne>=4.0,<5.0",
    # Error tracking. No-op unless SENTRY_DSN is set (config.observability); the
    # Django integration ships in the base package, so no extra is needed.
    "sentry-sdk>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.11,<5.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "django-stubs[compatible-mypy]>=6.0,<7.0",
    # Async test driver for the Channels WebSocket tests (ASS-240).
    "pytest-asyncio>=0.24,<2.0",
]

[project.optional-dependencies]
# Shared cross-worker channel layer for realtime (ASS-240). Only needed when
# CHANNEL_LAYERS_BACKEND=redis in a multi-process deployment; dev/test use the
# in-memory layer and never install this. The settings loader fails safe to the
# in-memory layer if it is unset/absent (config.settings.base._build_channel_layers).
realtime-redis = ["channels-redis>=4.2,<5.0"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated Django migrations are not hand-maintained (and are #25 human-gated),
# so ruff neither lints nor auto-fixes them — mirroring the [tool.mypy] exclude.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Settings modules use star-imports by design (base -> dev/test layering).
"config/settings/*.py" = ["F403", "F405"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
# Third-party Django ecosystem packages ship incomplete stubs; do not fail on
# their missing types, but keep strict checking on our own code.
ignore_missing_imports = true
# Migrations are generated; excluding them keeps strict mode focused on code we
# actually author (CONSTRAINTS #25 — migrations are human-gated, not edited).
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# Discover tests inside each domain app's tests/ package.
testpaths = ["apps", "config"]
# Realtime WebSocket tests opt in explicitly with @pytest.mark.asyncio (ASS-240);
# strict mode leaves every existing sync test untouched.
asyncio_mode = "strict"
